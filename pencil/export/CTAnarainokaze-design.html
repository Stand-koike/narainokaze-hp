<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="相談CTA"
      class="box-border w-full h-[573px] shrink-0 flex flex-row gap-[120px] p-[80px_100px] justify-center items-center bg-[url('../assets/images/IMGP1204.JPG')] bg-no-repeat bg-cover bg-center overflow-hidden relative"
    >
      <div
        data-pencil-name="CTA Overlay"
        class="box-border w-[1440px] h-[573px] absolute left-0 top-0 bg-[#1a242299] [z-index:0]"
      ></div>
      <div
        data-pencil-name="Staff 4"
        class="box-border w-[299px] shrink-0 h-[328px] flex flex-col gap-[16px] justify-start items-start relative [z-index:1]"
      >
        <div
          data-pencil-name="Staff Photo 4"
          class="box-border w-[299px] h-[246px] shrink-0 flex flex-col gap-0 justify-center items-center [background-image:linear-gradient(#ffffff1a,_#ffffff1a),_url('staff-00.jpg')] [background-repeat:no-repeat,_no-repeat] [background-size:100%_100%,_cover] [background-position:0%_0%,_center]"
        ></div>
        <div
          data-pencil-name="Staff Name"
          class="text-[16px]/[normal] box-border text-[#fafafaff] font-['Shippori_Mincho',system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
        >
          ミニ女将　娘のかいりちゃん
        </div>
        <div
          data-pencil-name="Staff Phrase"
          class="text-[13px]/[21px] box-border w-full text-[#edededff] font-['Shippori_Mincho',system-ui,sans-serif] font-normal text-left"
        >
          遊びに来てね。
        </div>
      </div>
      <div
        data-pencil-name="Frame 2"
        class="box-border w-fit shrink-0 h-fit flex flex-col gap-[20px] justify-center items-center relative [z-index:2]"
      >
        <div
          data-pencil-name="CTA Heading"
          class="text-[36px]/[normal] box-border text-[#FFFFFF] font-['Shippori_Mincho',system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
        >
          お電話でのご予約・お問い合わせ
        </div>
        <div
          data-pencil-name="CTA Actions"
          class="box-border w-fit h-fit shrink-0 flex flex-row gap-[20px] p-[12px_0px_0px_0px] justify-center items-center"
        >
          <div
            data-pencil-name="CTA Tel"
            class="text-[28px]/[normal] box-border text-[#BFA170] font-['Shippori_Mincho',system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
          >
            0558-36-4500
          </div>
          <div
            data-pencil-name="CTA Book"
            class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[14px_28px] justify-start items-center bg-[#BFA170] rounded-[2px]"
          >
            <div
              data-pencil-name="CTA Book Label"
              class="text-[14px]/[normal] box-border text-[#2E3334] font-['Shippori_Mincho',system-ui,sans-serif] font-normal text-left [white-space:nowrap]"
            >
              空室確認・予約
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
