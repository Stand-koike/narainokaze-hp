<section
        data-content-bind="news"
        data-animate="reveal"
        class="box-border w-full h-fit shrink-0 flex flex-col gap-[40px] px-5 py-12 md:p-[96px_80px] justify-start items-center bg-[#FFFFFF]"
      >
        <div
          data-component="section-heading"
          data-variant="centered-en-ja"
          data-head-pencil-name="News Head"
          data-en-pencil-name="News En"
          data-ja-pencil-name="News Ja"
        ></div>
        <div
          data-pencil-name="News Grid"
          class="box-border w-full h-fit shrink-0 flex md:grid md:grid-cols-2 xl:grid-cols-4 gap-5 md:gap-[20px] overflow-x-auto md:overflow-visible snap-x snap-mandatory md:snap-none pb-2 md:pb-0 -mx-5 px-5 md:mx-0 md:px-0 justify-start items-start"
        ></div>
        <div data-component="button" data-variant="outline" data-pencil-name="News More" data-padding="12px_24px"></div>
      </section>
