<section
        data-content-bind="news"
        data-animate="reveal"
        class="box-border w-full h-fit shrink-0 flex flex-col gap-[40px] px-5 py-16 md:px-[80px] md:py-[96px] justify-start items-center bg-[#FFFFFF]"
      >
        <div
          data-component="section-heading"
          data-variant="centered-en-ja"
          data-head-pencil-name="News Head"
          data-en-pencil-name="News En"
          data-ja-pencil-name="News Ja"
        ></div>
        <div
          data-pencil-name="News Grid"
          class="box-border w-full h-fit shrink-0 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5 md:gap-[20px] justify-start items-start"
        ></div>
        <div data-component="button" data-variant="outline" data-pencil-name="News More" data-padding="12px_24px"></div>
      </section>
