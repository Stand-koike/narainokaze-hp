<section
        id="intro"
        data-animate="reveal"
        data-pencil-name="Intro"
        class="box-border w-full h-fit shrink-0 flex flex-row gap-[64px] p-[100px_0px_100px_120px] justify-start items-center bg-[#F0F4F3] relative"
      >
        <div
          data-pencil-name="Intro Text"
          class="box-border [flex:1_1_0] h-fit flex flex-col gap-[24px] justify-start items-start relative [z-index:0]"
        >
          <div
            data-pencil-name="Intro Heading"
            class="text-[36px]/[54px] box-border w-full text-[#2E3334] font-['Shippori_Mincho',system-ui,sans-serif] font-medium text-left"
          >
            何もしない贅沢。
          </div>
          <div
            data-pencil-name="Intro Body"
            class="text-[16px]/[32px] box-border w-full text-[#4A5456] font-['Shippori_Mincho',system-ui,sans-serif] font-normal text-left"
          >
            おじいちゃん、おばあちゃん、パパ、ママ、そして小さな君へ。
            <br />
            観光地を巡る慌ただしい旅ではなく、
            <br />
            三世代がそれぞれのペースで過ごす、小さな漁師宿です。
          </div>
        </div>
        <div
          data-pencil-name="Intro Label"
          data-animate="label"
          class="text-[230px]/[normal] box-border absolute left-[-9px] top-[22px] text-[#4a5d5b1a] font-['Cormorant_Garamond',system-ui,sans-serif] font-normal italic tracking-[2px] text-left [white-space:nowrap] [z-index:1]"
        >
          Welcome
        </div>
        <img
          data-pencil-name="Intro Image"
          src="../assets/images/intro.jpg"
          alt="外浦の海を望む宿の風景"
          class="box-border w-[720px] shrink-0 h-[440px] relative [z-index:2] object-cover"
        />
      </section>
