<section
        id="stay"
        data-animate="reveal"
        data-pencil-name="温泉と客室"
        class="box-border w-full h-fit shrink-0 flex flex-col gap-[40px] px-5 py-16 md:px-[80px] md:py-[100px] justify-start items-center bg-[#E8EEEA] relative"
      >
        <div
          data-pencil-name="Stay En Label"
          data-animate="label"
          class="text-[230px]/[normal] box-border absolute left-[132px] top-[-47px] text-[#4a5d5b14] font-['Cormorant_Garamond',system-ui,sans-serif] font-normal italic tracking-[2px] text-left [white-space:nowrap] [z-index:0] hidden md:block"
        >
          Stay
        </div>
        <div
          data-pencil-name="Stay Head"
          class="box-border w-full max-w-[640px] md:w-[640px] h-fit shrink-0 flex flex-col gap-[12px] justify-start items-center relative [z-index:1]"
        >
          <div
            data-pencil-name="Stay Heading"
            class="text-[32px]/[46px] box-border w-full text-[#2E3334] font-['Shippori_Mincho',system-ui,sans-serif] font-medium text-center"
          >
            ペースが違う世代が、
            <br />
            いっしょに泊まれる理由
          </div>
        </div>
        <div
          data-pencil-name="Stay Row"
          class="box-border w-full h-fit shrink-0 flex flex-col lg:flex-row gap-8 lg:gap-[32px] justify-start items-start relative [z-index:2]"
        >
          <div
            id="onsen"
            data-pencil-name="Onsen Block"
            class="box-border [flex:1_1_0] h-fit flex flex-col gap-[18px] justify-start items-start"
          >
            <img
              data-pencil-name="Onsen Img"
              src="../assets/images/onsen.jpg"
              alt="客室温泉"
              class="box-border w-full h-[468px] shrink-0 object-cover"
            />
            <div
              data-pencil-name="Onsen Title"
              class="text-[22px]/[normal] box-border text-[#2E3334] font-['Shippori_Mincho',system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
            >
              温泉
            </div>
            <div
              data-pencil-name="Onsen Body"
              class="text-[14px]/[27px] box-border w-full text-[#4A5456] font-['Shippori_Mincho',system-ui,sans-serif] font-normal text-left"
            >
              祖父母も子どもも、自分の時間で湯に。
              <br />
              海と湯に身をあずけて、芯からほどける。
            </div>
            <div data-component="button-outline" data-pencil-name="Onsen CTA" data-pencil-name-label="Onsen CTA Label" data-padding="10px_20px" data-label="温泉を見る" data-href="#onsen"></div>
          </div>
          <div
            id="rooms"
            data-pencil-name="Rooms Block"
            class="box-border [flex:1_1_0] h-fit flex flex-col gap-[18px] justify-start items-start"
          >
            <img
              data-pencil-name="Rooms Img"
              src="../assets/images/rooms.jpg"
              alt="海を望む客室"
              class="box-border w-full h-[468px] shrink-0 object-cover"
            />
            <div
              data-pencil-name="Rooms Title"
              class="text-[22px]/[normal] box-border text-[#2E3334] font-['Shippori_Mincho',system-ui,sans-serif] font-medium text-left [white-space:nowrap]"
            >
              客室
            </div>
            <div
              data-pencil-name="Rooms Body"
              class="text-[14px]/[27px] box-border w-full text-[#4A5456] font-['Shippori_Mincho',system-ui,sans-serif] font-normal text-left"
            >
              みんなで、でもそれぞれの時間を過ごせる部屋。
              <br />
              波音を枕に、思い出を語らう。
            </div>
            <div data-component="button-outline" data-pencil-name="Rooms CTA" data-pencil-name-label="Rooms CTA Label" data-padding="10px_20px" data-label="客室を見る" data-href="#rooms"></div>
          </div>
        </div>
      </section>
