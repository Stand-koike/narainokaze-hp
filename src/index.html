<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蒼海の宿 ならいの風 | 外浦の海まで徒歩1分</title>
    <meta
      name="description"
      content="外浦の海まで徒歩1分。漁師が届ける地魚と客室温泉の宿、蒼海の宿 ならいの風。三世代で過ごす下田・外浦の旅へ。"
    />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond%3Aital%2Cwght%400%2C300..700%3B1%2C300..700&family=Shippori+Antique+B1%3Awght%40400&family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/header-overlay.css" />
    <link rel="stylesheet" href="styles/mobile-chrome.css" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      :root {
        --lux-ease: cubic-bezier(0.16, 1, 0.3, 1);
        --lux-duration: 1.5s;
        --lux-duration-slow: 2.3s;
        --lux-rise: 40px;
        --lux-slide: 68px;
      }

      html.js .lux-section .lux-item {
        opacity: 0;
        transition:
          opacity var(--lux-duration) var(--lux-ease),
          transform var(--lux-duration) var(--lux-ease);
        transition-delay: calc(var(--lux-i, 0) * 180ms);
        will-change: opacity, transform;
      }

      html.js .lux-section .lux-item[data-lux-dir="up"] {
        transform: translate3d(0, var(--lux-rise), 0);
      }

      html.js .lux-section .lux-item[data-lux-dir="left"] {
        transform: translate3d(calc(var(--lux-slide) * -1), 0, 0);
      }

      html.js .lux-section .lux-item[data-lux-dir="right"] {
        transform: translate3d(var(--lux-slide), 0, 0);
      }

      html.js .lux-section .lux-item[data-lux-dir="fade"] {
        transition-duration: var(--lux-duration-slow);
        transform: none;
      }

      html.js .lux-section.lux-inview .lux-item {
        opacity: 1 !important;
        transform: none !important;
      }

      @keyframes luxKenBurns {
        from { background-size: 100% 100%; }
        to { background-size: 108% 108%; }
      }

      .lux-ken-burns {
        background-repeat: no-repeat !important;
        background-position: center !important;
        animation: luxKenBurns 22s var(--lux-ease) forwards;
      }

      [data-pencil-name^="News 20"],
      [data-pencil-name="Onsen Block"],
      [data-pencil-name="Rooms Block"] {
        overflow: hidden;
      }

      .lux-image-hover {
        transition: transform 0.75s var(--lux-ease);
        transform-origin: center;
      }

      [data-pencil-name="Onsen Block"]:hover .lux-image-hover,
      [data-pencil-name="Rooms Block"]:hover .lux-image-hover,
      [data-pencil-name^="News 20"]:hover .lux-image-hover {
        transform: scale(1.045);
      }

      @media (prefers-reduced-motion: reduce) {
        html.js .lux-section .lux-item {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }

        .lux-ken-burns {
          animation: none !important;
        }

        .lux-image-hover {
          transition: none !important;
        }
      }

      [data-fade-slider] [data-fade-stage],
      [data-fade-slider] [data-fade-slide] {
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }

      .pen-fade-dots {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 10;
        display: flex;
        gap: 8px;
      }

      @media (min-width: 768px) {
        .pen-fade-dots {
          right: 80px;
          bottom: 24px;
        }
      }

      .pen-fade-dot {
        width: 8px;
        height: 8px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .pen-fade-dot.is-active {
        background-color: #ffffff;
      }

      @media (prefers-reduced-motion: reduce) {
        [data-fade-slider] [data-fade-stage],
        [data-fade-slider] [data-fade-slide],
        [data-fade-caption] {
          transition: none !important;
        }
      }
    </style>
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body data-page="top">
    <div
      data-pencil-name="TOP — 料理推し案"
      class="box-border w-full max-w-[1440px] mx-auto h-fit flex flex-col gap-0 justify-start items-stretch bg-[#F0F4F3] overflow-hidden"
    >
      <div data-include="sections/header.html"></div>
      <main>
        <div data-include="sections/hero-fade.html"></div>
        <div data-include="sections/intro.html"></div>
        <div data-include="sections/cuisine.html"></div>
        <div data-include="sections/stay.html"></div>
        <div data-include="sections/news.html"></div>
        <div data-include="sections/faq.html"></div>
        <div data-include="sections/access.html"></div>
        <div data-include="sections/final-cta.html"></div>
      </main>
      <div data-include="sections/footer.html"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="scripts/load-data.js"></script>
    <script src="scripts/load-sections.js"></script>
    <script src="scripts/animation.js"></script>
    <script src="scripts/mobile-chrome.js"></script>
    <script src="scripts/luxury-reveal.js"></script>
    <script src="scripts/pen-fade.js"></script>
  </body>
</html>
