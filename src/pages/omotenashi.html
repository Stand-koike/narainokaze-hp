<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おもてなし | 蒼海の宿 ならいの風</title>
    <meta
      name="description"
      content="外浦の海のそばで、皆さまのご到着をお待ちしています。スタッフ紹介。蒼海の宿 ならいの風。"
    />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond%3Aital%2Cwght%400%2C300..700%3B1%2C300..700&family=Shippori+Antique+B1%3Awght%40400&family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/header-overlay.css" />
    <link rel="stylesheet" href="../styles/mobile-chrome.css" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      .staff-photo.has-photo {
        background-color: transparent;
      }

      .staff-photo.has-photo [data-pencil-name="Photo Label"] {
        display: none;
      }

      .omotenashi-hero-catch__line {
        display: block;
      }

      .omotenashi-hero-catch__part {
        display: inline;
      }

      .omotenashi-intro-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .omotenashi-intro-body__line {
        display: block;
      }

      .omotenashi-intro-body__part {
        display: inline;
      }

      .omotenashi-staff-ja__part {
        display: inline;
      }

      @media (max-width: 767px) {
        .omotenashi-hero-catch {
          font-size: clamp(28px, 8.5vw, 34px);
          line-height: 1.45;
          letter-spacing: -0.025em;
        }

        .omotenashi-hero-catch__part {
          white-space: nowrap;
        }

        .omotenashi-intro-body {
          font-size: 13px;
          line-height: 2;
          letter-spacing: -0.025em;
        }

        .omotenashi-intro-body__part {
          white-space: nowrap;
        }

        .omotenashi-staff-ja {
          display: flex;
          flex-direction: column;
          align-items: center;
          font-size: 24px;
          line-height: 1.5;
          letter-spacing: -0.02em;
        }

        .omotenashi-staff-ja__part {
          white-space: nowrap;
        }
      }

      @media (min-width: 768px) {
        .omotenashi-staff-ja {
          font-size: 32px;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body data-page="omotenashi">
    <div
      data-pencil-name="おもてなし — スタッフ紹介"
      class="box-border w-full max-w-[1440px] mx-auto h-fit flex flex-col gap-0 justify-start items-stretch bg-[#F0F4F3] overflow-hidden"
    >
      <main class="w-full">
        <div data-include="../sections/omotenashi-hero.html"></div>
        <div data-include="../sections/omotenashi-intro.html"></div>
        <div data-include="../sections/omotenashi-staff.html"></div>
        <div data-include="../sections/omotenashi-cta.html"></div>
        <div data-include="../sections/header.html"></div>

      </main>
      <div data-include="../sections/footer.html"></div>
    </div>
    <script>
      window.__SRC_BASE__ = "../";
      window.__ASSET_BASE__ = "../../assets/";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="../scripts/load-data.js"></script>
    <script src="../scripts/load-sections.js"></script>
    <script src="../scripts/animation.js"></script>
    <script src="../scripts/mobile-chrome.js"></script>
  </body>
</html>
