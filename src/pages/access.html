<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アクセス | 蒼海の宿 ならいの風</title>
    <meta
      name="description"
      content="遠くて近い楽園、下田・外浦。電車・車でのアクセスとご案内。蒼海の宿 ならいの風（静岡県下田市柿崎）。"
    />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond%3Aital%2Cwght%401%2C300..700&family=Shippori+Antique+B1%3Awght%40400&family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/header-overlay.css" />
    <link rel="stylesheet" href="../styles/mobile-chrome.css" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      .access-intro-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .access-intro-body__line {
        display: block;
      }

      .access-intro-body__part {
        display: inline;
      }

      @media (max-width: 767px) {
        .access-intro-body {
          font-size: 13px;
          line-height: 2;
          letter-spacing: -0.025em;
        }

        .access-intro-body__part {
          white-space: nowrap;
        }
      }

      .access-route-bus__line {
        display: inline;
      }

      .access-route-bus__part {
        display: inline;
      }

      .access-route-bus__line:first-child::after {
        content: "　";
      }

      @media (max-width: 767px) {
        .access-route-bus__line {
          display: block;
        }

        .access-route-bus__line:first-child::after {
          content: none;
        }

        .access-route-bus__part {
          white-space: nowrap;
        }
      }

      [data-pencil-name="Route Row"] {
        align-items: stretch;
      }

      [data-pencil-name="Route Row"] > [data-pencil-name^="Route "] {
        flex: 1 1 0;
        min-width: 0;
        width: 100%;
        height: auto;
      }

      @media (min-width: 768px) {
        [data-pencil-name="Route Row"] > [data-pencil-name^="Route "] {
          height: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="アクセス — 三世代温もり案"
      class="box-border w-full max-w-[1440px] mx-auto h-fit flex flex-col gap-0 justify-start items-stretch bg-[#F0F4F3] overflow-hidden"
    >
      <main class="w-full">
        <div data-include="../sections/access-hero.html"></div>
        <div data-include="../sections/access-intro.html"></div>
        <div data-include="../sections/access-location.html"></div>
        <div data-include="../sections/access-routes.html"></div>
        <div data-include="../sections/access-cta.html"></div>
        <div data-include="../sections/header.html"></div>

      </main>
      <div data-include="../sections/footer.html"></div>
    </div>
    <script>
      window.__SRC_BASE__ = "../";
      window.__ASSET_BASE__ = "../../assets/";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="../scripts/load-data.js"></script>
    <script src="../scripts/load-sections.js"></script>
    <script src="../scripts/animation.js"></script>
    <script src="../scripts/mobile-chrome.js"></script>
  </body>
</html>
