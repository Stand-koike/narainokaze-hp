<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>温泉 | 蒼海の宿 ならいの風</title>
    <meta
      name="description"
      content="伊豆石の湯に身をあずけて。大浴場と客室温泉で、祖父母も子どもも自分の時間を。蒼海の宿 ならいの風。"
    />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond%3Aital%2Cwght%400%2C300..700%3B1%2C300..700&family=Shippori+Antique+B1%3Awght%40400&family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/header-overlay.css" />
    <link rel="stylesheet" href="../styles/mobile-chrome.css" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      .onsen-intro-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .onsen-intro-body__line {
        display: block;
      }

      .onsen-intro-body__part {
        display: inline;
      }

      [data-pencil-name="Bath Row"] > [data-pencil-name^="Bath "] {
        flex: 1 1 0;
        min-width: 0;
      }

      @media (min-width: 768px) {
        [data-pencil-name="Bath Row"] {
          flex-direction: row;
          gap: 32px;
        }
      }

      [data-pencil-name="Bath Img"] {
        box-sizing: border-box;
        width: 100%;
        height: 280px;
        flex-shrink: 0;
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }

      @media (min-width: 768px) {
        [data-pencil-name="Bath Img"] {
          height: 468px;
        }
      }

      @media (max-width: 767px) {
        .onsen-intro-body {
          font-size: 13px;
          line-height: 2;
          letter-spacing: -0.025em;
        }

        .onsen-intro-body__line {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .onsen-intro-body__part {
          white-space: nowrap;
        }

        [data-pencil-name="Priv Body"],
        [data-pencil-name="Fam Body"],
        [data-pencil-name="Bath Desc"] {
          letter-spacing: -0.02em;
        }

        [data-pencil-name="Priv Body"],
        [data-pencil-name="Fam Body"] {
          font-size: 14px;
          line-height: 1.9;
        }
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="温泉 — 三世代温もり案"
      class="box-border w-full max-w-[1440px] mx-auto h-fit flex flex-col gap-0 justify-start items-stretch bg-[#F0F4F3] overflow-hidden"
    >
      <main class="w-full">
        <div data-include="../sections/onsen-hero.html"></div>
        <div data-include="../sections/onsen-intro.html"></div>
        <div data-include="../sections/onsen-public-bath.html"></div>
        <div data-include="../sections/onsen-private-bath.html"></div>
        <div data-include="../sections/onsen-generations.html"></div>
        <div data-include="../sections/onsen-cta.html"></div>
        <div data-include="../sections/header.html"></div>

      </main>
      <div data-include="../sections/footer.html"></div>
    </div>
    <script>
      window.__SRC_BASE__ = "../";
      window.__ASSET_BASE__ = "../../assets/";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="../scripts/load-data.js"></script>
    <script src="../scripts/load-sections.js"></script>
    <script src="../scripts/animation.js"></script>
    <script src="../scripts/mobile-chrome.js"></script>
  </body>
</html>
