<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お部屋 | 蒼海の宿 ならいの風</title>
    <meta
      name="description"
      content="海を望むゆとりの客室。三世代が気兼ねなく寛げるお部屋をご案内。蒼海の宿 ならいの風（下田・外浦）。"
    />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond%3Aital%2Cwght%400%2C300..700%3B1%2C300..700&family=Shippori+Antique+B1%3Awght%40400&family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/header-overlay.css" />
    <link rel="stylesheet" href="../styles/mobile-chrome.css" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      .rooms-gallery__main-img,
      .rooms-gallery__thumb-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .rooms-gallery__main-img {
        transition: opacity 0.35s ease;
      }

      .rooms-gallery__thumb {
        border: 2px solid transparent;
      }

      .rooms-gallery__thumb.is-active {
        border-color: #4A5D5B;
      }

      .rooms-gallery__hint {
        margin-left: auto;
      }

      .room-type-card__img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: transform 0.5s ease;
      }

      .room-type-card--hover:hover .room-type-card__img {
        transform: scale(1.04);
      }

      @media (prefers-reduced-motion: reduce) {
        .room-type-card__img {
          transition: none;
        }

        .room-type-card--hover:hover .room-type-card__img {
          transform: none;
        }
      }

      .warm-lightbox {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(26, 36, 34, 0.88);
        padding: 40px 24px;
      }

      .warm-lightbox.is-open {
        display: flex;
      }

      .warm-lightbox__img-wrap {
        position: relative;
        max-width: min(960px, 90vw);
        max-height: 80vh;
      }

      .warm-lightbox__img-wrap img {
        display: block;
        max-width: 100%;
        max-height: 80vh;
        object-fit: contain;
      }

      .warm-lightbox__close,
      .warm-lightbox__prev,
      .warm-lightbox__next {
        appearance: none;
        border: none;
        background: none;
        color: #fff;
        font-family: "Cormorant Garamond", serif;
        cursor: pointer;
        position: absolute;
        z-index: 2;
      }

      .warm-lightbox__close {
        top: 24px;
        right: 32px;
        font-size: 36px;
        line-height: 1;
      }

      .warm-lightbox__prev,
      .warm-lightbox__next {
        top: 50%;
        transform: translateY(-50%);
        font-size: 48px;
        line-height: 1;
        padding: 12px;
      }

      .warm-lightbox__prev {
        left: 24px;
      }

      .warm-lightbox__next {
        right: 24px;
      }

      .warm-lightbox__caption {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: #F0F4F3;
        font-size: 12px;
        white-space: nowrap;
        margin: 0;
        font-family: "Shippori Mincho", system-ui, sans-serif;
      }

      body.warm-lightbox-open {
        overflow: hidden;
      }

      @media (max-width: 768px) {
        .warm-lightbox__prev {
          left: 8px;
        }

        .warm-lightbox__next {
          right: 8px;
        }

        [data-room-lead] {
          font-size: 13px;
          line-height: 1.85;
          letter-spacing: -0.02em;
        }
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="客室 — 三世代温もり案"
      class="box-border w-full max-w-[1440px] mx-auto h-fit flex flex-col gap-0 justify-start items-stretch bg-[#F0F4F3] overflow-hidden"
    >
      <main class="w-full">
        <div data-include="../sections/rooms-hero.html"></div>
        <div data-include="../sections/rooms-intro.html"></div>
        <div data-include="../sections/rooms-featured.html"></div>
        <div data-include="../sections/rooms-types.html"></div>
        <div data-include="../sections/rooms-guest-info.html"></div>
        <div data-include="../sections/rooms-cta.html"></div>
        <div data-include="../sections/header.html"></div>

      </main>
      <div data-include="../sections/footer.html"></div>
    </div>

    <div class="warm-lightbox" data-lightbox aria-hidden="true" role="dialog" aria-label="写真拡大表示">
      <button type="button" class="warm-lightbox__close" data-lightbox-close aria-label="閉じる">×</button>
      <button type="button" class="warm-lightbox__prev" data-lightbox-prev aria-label="前の写真">‹</button>
      <div class="warm-lightbox__img-wrap">
        <img src="" alt="" data-lightbox-img />
      </div>
      <button type="button" class="warm-lightbox__next" data-lightbox-next aria-label="次の写真">›</button>
      <p class="warm-lightbox__caption" data-lightbox-caption></p>
    </div>

    <script>
      window.__SRC_BASE__ = "../";
      window.__ASSET_BASE__ = "../../assets/";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="../scripts/load-data.js"></script>
    <script src="../scripts/load-sections.js"></script>
    <script src="../scripts/animation.js"></script>
    <script src="../scripts/mobile-chrome.js"></script>
    <script src="../scripts/rooms-gallery.js"></script>
  </body>
</html>
