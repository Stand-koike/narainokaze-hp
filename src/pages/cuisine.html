<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お料理 | 蒼海の宿 ならいの風</title>
    <meta
      name="description"
      content="美味に感動、新鮮な海の幸。食卓で三世代がそろうお料理のご案内。蒼海の宿 ならいの風（下田・外浦）。"
    />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond%3Aital%2Cwght%401%2C300..700&family=Shippori+Antique+B1%3Awght%40400&family=Shippori+Mincho%3Awght%40400%3B500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/header-overlay.css" />
    <link rel="stylesheet" href="../styles/mobile-chrome.css" />
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      /* 天草.jpg: 右側の人物・天草が入るようトリミング位置を右寄せ */
      .page-hero__bg--cuisine {
        background-position: 78% center;
      }

      .cuisine-intro-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .cuisine-intro-body__line {
        display: block;
      }

      .cuisine-feat-body {
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .cuisine-fam-body {
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .cuisine-harvest-body {
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      @media (max-width: 767px) {
        .page-hero__bg--cuisine {
          background-position: 88% center;
        }

        .cuisine-intro-body {
          font-size: 13px;
          line-height: 2;
          letter-spacing: -0.02em;
        }

        .cuisine-intro-body__line {
          white-space: nowrap;
        }

        .cuisine-feat-body {
          font-size: 15px;
          line-height: 2;
          letter-spacing: -0.01em;
        }

        .cuisine-fam-body {
          font-size: 14px;
          line-height: 1.9;
          letter-spacing: -0.02em;
        }

        .cuisine-fam-body__line {
          display: inline-block;
        }

        .cuisine-harvest-body {
          font-size: 15px;
          line-height: 2;
          letter-spacing: -0.01em;
        }

        .cuisine-cta-body {
          letter-spacing: -0.025em;
        }
      }

      .cuisine-slideshow__thumbs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        width: 100%;
      }

      .cuisine-slideshow__thumbs--2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .cuisine-slideshow__main-img,
      .cuisine-slideshow__thumb-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .cuisine-slideshow__main-img {
        transition: opacity 0.35s ease;
      }

      .cuisine-slideshow__thumb {
        width: 100%;
        min-width: 0;
        aspect-ratio: 12 / 5;
        border: 2px solid transparent;
      }

      .cuisine-slideshow__thumb.is-active {
        border-color: #4A5D5B;
      }

      .cuisine-slideshow__dot {
        background-color: #C8D0CC;
      }

      .cuisine-slideshow__dot.is-active {
        background-color: #BFA170;
      }

      .cuisine-card__img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
      }

      .cuisine-card--hover:hover .cuisine-card__img {
        transform: scale(1.04);
      }

      .cuisine-food-scroll__track {
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .cuisine-food-scroll__track::-webkit-scrollbar {
        display: none;
      }

      .cuisine-food-scroll__page {
        min-width: 100%;
      }

      .cuisine-food-scroll__img-wrap {
        height: 180px;
      }

      @media (prefers-reduced-motion: reduce) {
        .cuisine-slideshow__main-img,
        .cuisine-card__img {
          transition: none;
        }

        .cuisine-card--hover:hover .cuisine-card__img {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-name="料理 — 三世代温もり案"
      class="box-border w-full max-w-[1440px] mx-auto h-fit flex flex-col gap-0 justify-start items-stretch bg-[#F0F4F3] overflow-hidden"
    >
      <main class="w-full">
        <div data-include="../sections/cuisine-hero.html"></div>
        <div data-include="../sections/cuisine-intro.html"></div>
        <div data-include="../sections/cuisine-signature.html"></div>
        <div data-include="../sections/cuisine-banner.html"></div>
        <div data-include="../sections/cuisine-harvest.html"></div>
        <div data-include="../sections/cuisine-family.html"></div>
        <div data-include="../sections/cuisine-cta.html"></div>
        <div data-include="../sections/header.html"></div>

      </main>
      <div data-include="../sections/footer.html"></div>
    </div>
    <script>
      window.__SRC_BASE__ = "../";
      window.__ASSET_BASE__ = "../../assets/";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="../scripts/load-data.js"></script>
    <script src="../scripts/load-sections.js"></script>
    <script src="../scripts/animation.js"></script>
    <script src="../scripts/mobile-chrome.js"></script>
    <script src="../scripts/cuisine-slideshow.js"></script>
  </body>
</html>
